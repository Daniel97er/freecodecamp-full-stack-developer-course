<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="playing-cards">
    <!-- Ace of hearts -->
    <div class="card hearts">
      <div class="left">
        <span>A</span>
        <span>♥</span>
      </div>
      <div class="middle">
        <span>♥</span>
      </div>
      <div class="right">
        <span>A</span>
        <span>♥</span>
      </div>
    </div>

    <!-- King of spades -->
    <div class="card spades">
      <div class="left">
        <span>K</span>
        <span>♠</span>
      </div>
      <div class="middle">
        <span>♠</span>
        <span>♠</span>
        <span>♠</span>
      </div>
      <div class="right">
        <span>K</span>
        <span>♠</span>
      </div>
    </div>

    <!-- Queen of diamonds -->
    <div class="card diamonds">
      <div class="left">
        <span>Q</span>
        <span>♦</span>
      </div>
      <div class="middle">
        <span>♦</span>
        <span>♦</span>
        <span>♦</span>
      </div>
      <div class="right">
        <span>Q</span>
        <span>♦</span>
      </div>
    </div>

    <!-- Jack of clubs -->
    <div class="card clubs">
      <div class="left">
        <span>J</span>
        <span>♣</span>
      </div>
      <div class="middle">
        <span>♣</span>
        <span>♣</span>
        <span>♣</span>
      </div>
      <div class="right">
        <span>J</span>
        <span>♣</span>
      </div>
    </div>

    <!-- Ten of hearts -->
    <div class="card hearts">
      <div class="left">
        <span>10</span>
        <span>♥</span>
      </div>
      <div class="middle">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
      </div>
      <div class="right">
        <span>10</span>
        <span>♥</span>
      </div>
    </div>
  </main>
</body>

</html>
